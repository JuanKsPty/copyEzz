<!doctype html>
<!-- Quiz sintético para probar CopyEzz. Respuesta esperada: "b) TO_DATE".
     Regenerar el PNG: scripts/make-sample.sh -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cuestionario de práctica</title>
<style>
  body { margin: 0; background: #fff; font: 22px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1d2125; }
  .bar { display: flex; justify-content: flex-end; gap: 16px; padding: 24px 64px 0; }
  .timer { border: 2px solid #ca3120; padding: 8px 20px; }
  .hide { background: #ced4da; border-radius: 8px; padding: 8px 24px; }
  .question { margin: 24px 64px; background: #e7f3f5; border: 1px solid #b8dce2; border-radius: 10px; padding: 36px 48px; }
  .prompt { margin: 0 0 32px; }
  label { display: flex; align-items: center; gap: 18px; margin: 22px 0; }
  .radio { width: 22px; height: 22px; border: 2px solid #6a737b; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
  <div class="bar"><span class="timer">Tiempo restante 0:12:40</span><span class="hide">Ocultar</span></div>
  <div class="question">
    <p class="prompt">¿Qué función convierte una cadena de caracteres en un valor de tipo DATE?</p>
    <label><span class="radio"></span>a.&nbsp;&nbsp;TO_CHAR</label>
    <label><span class="radio"></span>b.&nbsp;&nbsp;TO_DATE</label>
    <label><span class="radio"></span>c.&nbsp;&nbsp;TO_NUMBER</label>
    <label><span class="radio"></span>d.&nbsp;&nbsp;DATE_FORMAT</label>
  </div>
</body>
</html>
